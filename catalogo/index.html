<!DOCTYPE html>
<!--
  Catálogo digital (flipbook) de Intercambios cotidianos.
  Las páginas están en pages/ como imágenes; se pasan con el efecto
  de voltear hoja usando la librería gratuita StPageFlip.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Intercambios cotidianos — Ninfa Espinoza</title>
  <meta name="description" content="Catálogo digital de la exposición individual Intercambios cotidianos de Ninfa Espinoza — Centro Cultural Sampedrano, San Pedro Sula, 2026.">
  <style>
    :root{ --bg:#15161a; --ink:#f0eee9; --soft:#97989d; --accent:#c6b79a; --line:#34363d; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
      font-family:"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
      overflow:hidden; overscroll-behavior:none; }
    .topbar{ position:fixed; top:0; left:0; right:0; height:54px; z-index:20;
      display:flex; align-items:center; justify-content:space-between; padding:0 18px; }
    .brand{ font-size:.78rem; letter-spacing:.13em; text-transform:uppercase; color:var(--soft); }
    .brand b{ color:var(--ink); font-weight:600; }
    .dl{ font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
      text-decoration:none; border:1px solid var(--line); padding:.5rem .85rem; border-radius:3px;
      transition:border-color .15s,color .15s; white-space:nowrap; }
    .dl:hover{ border-color:var(--accent); color:var(--accent); }
    .actions{ display:flex; align-items:center; gap:.7rem; }
    .langsw{ display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
    .langsw button{ background:none; border:0; color:var(--soft); font-size:.68rem; letter-spacing:.08em;
      padding:.5rem .62rem; cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
    .langsw button.active{ background:var(--accent); color:#15161a; }
    .stage{ position:absolute; inset:54px 0 66px; display:flex; align-items:center; justify-content:center; }
    #bookwrap{ margin:auto; }
    #book{ touch-action:pan-y; }
    .page img{ width:100%; height:100%; display:block; }
    .nav{ position:fixed; bottom:0; left:0; right:0; height:66px; z-index:20;
      display:flex; align-items:center; justify-content:center; gap:1.3rem; }
    .nav button{ background:none; border:1px solid var(--line); color:var(--ink);
      width:48px; height:48px; border-radius:50%; cursor:pointer; font-size:1.3rem; line-height:1;
      display:flex; align-items:center; justify-content:center; transition:all .15s; padding-bottom:3px; }
    .nav button:hover{ border-color:var(--accent); color:var(--accent); }
    .counter{ font-size:.8rem; color:var(--soft); min-width:86px; text-align:center; font-variant-numeric:tabular-nums; }
    .hint{ position:fixed; bottom:72px; left:0; right:0; text-align:center; font-size:.68rem;
      color:var(--soft); pointer-events:none; transition:opacity .4s; }
    .loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      color:var(--soft); font-size:.9rem; letter-spacing:.05em; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>Intercambios cotidianos</b> &nbsp;·&nbsp; Ninfa Espinoza</div>
    <div class="actions">
      <div class="langsw">
        <button id="btn-es" data-lang="es">ES</button>
        <button id="btn-en" data-lang="en">EN</button>
      </div>
      <a class="dl" id="dl" href="intercambios-cotidianos.pdf" download>Descargar PDF</a>
    </div>
  </div>

  <div class="loading" id="loading">Cargando catálogo…</div>
  <div class="stage"><div id="bookwrap"><div id="book"></div></div></div>

  <div class="nav">
    <button id="prev" aria-label="Página anterior">&lsaquo;</button>
    <span class="counter" id="counter">— / —</span>
    <button id="next" aria-label="Página siguiente">&rsaquo;</button>
  </div>
  <div class="hint" id="hint">Usa las flechas o desliza para pasar las páginas</div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    var N = 30;
    var LANG = 'es';
    var FOLDER = { es: 'pages', en: 'pages-en' };          // carpetas de imágenes por idioma
    var PDF = { es: 'intercambios-cotidianos.pdf', en: 'intercambios-cotidianos-en.pdf' };
    var UI = {
      es: { dl: 'Descargar PDF', hint: 'Usa las flechas o desliza para pasar las páginas' },
      en: { dl: 'Download PDF',  hint: 'Use the arrows or swipe to turn the pages' }
    };
    var realPages = [];
    function buildPages(){
      realPages = [];
      for (var i = 1; i <= N; i++) { realPages.push(FOLDER[LANG] + '/page-' + String(i).padStart(2,'0') + '.jpg'); }
    }
    var DARK = 'pages/cover-back.jpg';
    var RATIO = 1.294;                   // proporción horizontal de las páginas

    var PF = (window.St && window.St.PageFlip) ? window.St.PageFlip : window.PageFlip;
    var el = document.getElementById('book');
    var wrap = document.getElementById('bookwrap');
    var loading = document.getElementById('loading');
    var counter = document.getElementById('counter');
    var hint = document.getElementById('hint');
    var pageFlip = null;
    var mode = 'single';

    function currentReal(){
      if (!pageFlip) return 0;
      var idx = pageFlip.getCurrentPageIndex();
      return (mode === 'single') ? idx : Math.max(0, idx - 1);
    }
    function updCounter(){
      if (!pageFlip) return;
      var idx = pageFlip.getCurrentPageIndex();
      var real = (mode === 'single') ? (idx + 1) : Math.min(Math.max(idx, 1), N);
      counter.textContent = real + ' / ' + N;
    }

    // Celular (angosto): UNA hoja a la vez, grande.
    // Compu (ancho): libro de DOS hojas, con hoja oscura junto a portada/contraportada.
    function buildBook(startReal){
      var vw = window.innerWidth, vh = window.innerHeight;
      var narrow = true;   // una sola hoja en todos los tamaños (compu y celular)
      if (pageFlip) { try { pageFlip.destroy(); } catch (e) {} pageFlip = null; }
      wrap.innerHTML = '<div id="book"></div>';   // elemento siempre limpio y conectado
      el = document.getElementById('book');
      var opts, loadPages, startIdx;
      if (narrow) {
        mode = 'single';
        var availH = Math.max(220, vh - 150);
        var pageW = Math.min(Math.round(availH * RATIO), vw - 16);
        var pageH = Math.round(pageW / RATIO);
        wrap.style.width = pageW + 'px';
        wrap.style.height = pageH + 'px';
        opts = { width: pageW, height: pageH, size: 'stretch',
          minWidth: pageW, maxWidth: pageW, minHeight: pageH, maxHeight: pageH,
          showCover: true, usePortrait: true, maxShadowOpacity: 0.5, useMouseEvents: true };
        loadPages = realPages;
        startIdx = startReal;
      } else {
        mode = 'book';
        wrap.style.width = vw + 'px';
        wrap.style.height = Math.max(260, vh - 120) + 'px';
        opts = { width: 1100, height: 850, size: 'stretch',
          minWidth: 300, maxWidth: 3000, minHeight: 240, maxHeight: 2320,
          showCover: false, usePortrait: false, maxShadowOpacity: 0.6, useMouseEvents: true };
        loadPages = [DARK].concat(realPages).concat([DARK]);
        startIdx = startReal + 1;
      }
      // Páginas como <img> reales (modo HTML): nítidas en pantallas retina del celular.
      var html = '';
      for (var k = 0; k < loadPages.length; k++) {
        html += '<div class="page"><img src="' + loadPages[k] + '" alt=""></div>';
      }
      el.innerHTML = html;
      pageFlip = new PF(el, opts);
      pageFlip.loadFromHTML(el.querySelectorAll('.page'));
      pageFlip.on('init', function(){
        loading.style.display = 'none';
        if (startIdx) { try { pageFlip.turnToPage(startIdx); } catch (e) {} }
        updCounter();
      });
      pageFlip.on('flip', function(){ updCounter(); hint.style.opacity = '0'; });
    }

    // ----- idioma (ES / EN) -----
    var saved = null;
    try { saved = localStorage.getItem('catlang'); } catch (e) {}
    LANG = saved || (((navigator.language || '').toLowerCase().indexOf('en') === 0) ? 'en' : 'es');
    function applyLang(){
      var dl = document.getElementById('dl');
      dl.textContent = UI[LANG].dl;
      dl.setAttribute('href', PDF[LANG]);
      hint.textContent = UI[LANG].hint;
      document.getElementById('btn-es').classList.toggle('active', LANG === 'es');
      document.getElementById('btn-en').classList.toggle('active', LANG === 'en');
      document.documentElement.lang = LANG;
      buildPages();
    }
    function setLang(l){
      if (l === LANG) return;
      var keep = currentReal();
      LANG = l;
      try { localStorage.setItem('catlang', l); } catch (e) {}
      applyLang();
      buildBook(keep);
    }
    document.getElementById('btn-es').onclick = function(){ setLang('es'); };
    document.getElementById('btn-en').onclick = function(){ setLang('en'); };

    applyLang();
    buildBook(0);

    document.getElementById('next').onclick = function(){ if (pageFlip) pageFlip.flipNext(); };
    document.getElementById('prev').onclick = function(){ if (pageFlip) pageFlip.flipPrev(); };
    document.addEventListener('keydown', function(e){
      if (!pageFlip) return;
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'ArrowLeft')  pageFlip.flipPrev();
    });
    var rt;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){ buildBook(currentReal()); }, 260);
    });
  </script>
</body>
</html>
